<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Profilo trader · TradeDiario</title>
<style>
@font-face{font-family:"Garet";src:url("fonts/Garet-Book.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Garet";src:url("fonts/Garet-Heavy.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"TheBold";src:url("fonts/THEBOLDFONT-FREEVERSION.woff") format("woff");font-weight:700;font-display:swap}
:root{--font-title:"TheBold","Garet",system-ui,sans-serif;--font-body:"Garet",system-ui,sans-serif;--bg:#f4f1ea;--panel:#fbfaf6;--ink:#1a1d21;--mute:#5c6168;--line:#d9d4c7;--gain:#1d7a4f;--loss:#b03a3a;--accent:#1f4d3a;--accent-ink:#f4f1ea;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121416;--panel:#1a1e21;--ink:#ecebe6;--mute:#9a9da2;--line:#2b2f33;--gain:#7fd1ae;--loss:#ff8a8a;--accent:#7fd1ae;--accent-ink:#121416;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font-body);font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:32px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top a{color:var(--mute);text-decoration:none;font-size:14px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:26px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.av{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font:700 30px var(--font-title);color:#1a1d21}
.hero h1{font:700 34px var(--font-title);margin:0}
.muted{color:var(--mute);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.card span{font-size:12px;color:var(--mute);display:block}
.card b{font:700 24px var(--font-title);display:block;margin-top:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px}
.panel h2{font:700 22px var(--font-title);margin:0 0 12px}
.pos{color:var(--gain)}.neg{color:var(--loss)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mute);font-weight:400}
td.n,th.n{text-align:right}
.msg{text-align:center;padding:50px 10px;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px}
.bars div{flex:1;border-radius:8px 8px 0 0;min-width:10px}
svg text{font-family:var(--font-body)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="app">← TradeDiario</a><a href="leaderboard" id="lbLink" style="display:none">Vai alla Leaderboard</a></div>
  <div id="root"><div class="msg">Carico il profilo…</div></div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
var cfg=window.TRADEDIARIO_CONFIG||{};
var root=document.getElementById("root");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(n,d){d=d==null?2:d;return Number(n).toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d})}
function sgn(n){return (n>0?"+":"")+fmt(n)}
function cls(n){return n>0?"pos":n<0?"neg":""}
function show(html){root.innerHTML=html}
function emblem(color,name){
  return '<svg viewBox="0 0 48 56" width="34" height="40" aria-label="Rank '+esc(name)+'"><path d="M24 2 L44 10 V28 C44 40 36 49 24 54 C12 49 4 40 4 28 V10 Z" fill="'+esc(color)+'" stroke="var(--ink)" stroke-width="1.5"/><text x="24" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1d21">'+esc((name||"?").charAt(0))+'</text></svg>';
}
function card(label,value){ return value==null?"":'<div class="card"><span>'+label+'</span><b>'+value+'</b></div>' }

function equitySVG(pts){
  if(!pts||pts.length<2) return '<div class="muted">Servono almeno due giornate per disegnare la curva.</div>';
  var W=860,H=220,pl=50,pr=10,pt=10,pb=24,vals=pts.map(function(p){return p.v});
  var mn=Math.min.apply(null,vals.concat([0])),mx=Math.max.apply(null,vals.concat([0]));if(mx===mn){mx+=1;mn-=1}
  var x=function(i){return pl+i*(W-pl-pr)/(pts.length-1)},y=function(v){return pt+(mx-v)*(H-pt-pb)/(mx-mn)};
  var d=pts.map(function(p,i){return (i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)}).join(" ");
  var col=vals[vals.length-1]>=0?"var(--gain)":"var(--loss)";
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Curva del capitale in percentuale">'+
    '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--mute)" stroke-dasharray="3 3"/>'+
    '<text x="'+(pl-6)+'" y="'+(y(mx)+4)+'" text-anchor="end" font-size="11" fill="var(--mute)">'+fmt(mx,1)+'%</text>'+
    '<text x="'+(pl-6)+'" y="'+(y(mn)+4)+'" text-anchor="end" font-size="11" fill="var(--mute)">'+fmt(mn,1)+'%</text>'+
    '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linejoin="round"/></svg>';
}
function historyBars(h){
  if(!h||!h.length) return '<div class="muted">Nessun mese con operazioni.</div>';
  var mx=Math.max.apply(null,h.map(function(x){return Math.abs(x.v)}).concat([1]));
  return '<div class="bars">'+h.map(function(x){
    var hh=Math.max(4,Math.abs(x.v)/mx*130);
    return '<div title="'+esc(x.m)+': '+sgn(x.v)+'%" style="height:'+hh+'px;background:'+(x.v>=0?"var(--gain)":"var(--loss)")+';opacity:.85"></div>';
  }).join("")+'</div><div class="muted" style="display:flex;justify-content:space-between;margin-top:6px"><span>'+esc(h[0].m)+'</span><span>'+esc(h[h.length-1].m)+'</span></div>';
}

async function init(){
  var u=new URLSearchParams(location.search).get("u")||"";
  if(!u){ show('<div class="msg">Nessun profilo selezionato.</div>'); return }
  var sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
  var r=await sb.rpc("public_profile",{p_username:u});
  if(r.error){ show('<div class="msg">Profilo non disponibile in questo momento.</div>'); return }
  var d=r.data;
  if(!d||!d.available){ show('<div class="msg">Questo profilo non è disponibile o è privato.</div>'); return }
  document.title=d.username+" · TradeDiario";
  var rk=d.rank,st=d.stats||{},col=(rk&&rk.color)||"#b87333";
  var html='<section class="hero"><div class="av" style="background:'+esc(col)+'">'+esc(d.username.charAt(0).toUpperCase())+'</div>'+
    '<div style="flex:1;min-width:200px"><h1>'+esc(d.username)+'</h1><div class="muted">Trader dal '+esc(d.member_since)+'</div>'+
    (rk?'<div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="pill" style="color:'+esc(col)+'">'+emblem(col,rk.rank)+' '+esc(rk.rank)+'</span><span class="pill">Rating '+rk.points+'</span>'+(d.position?'<span class="pill">#'+d.position+' in classifica</span>':'')+'</div>':'')+
    '</div></section>';
  html+='<section class="grid">'+
    card("Rendimento", st.return_pct!=null?'<span class="'+cls(st.return_pct)+'">'+sgn(st.return_pct)+'%</span>':null)+
    card("Win rate", st.win_rate!=null?fmt(st.win_rate,1)+'%':null)+
    card("Profit factor", st.profit_factor!=null?fmt(st.profit_factor,2):null)+
    card("Drawdown massimo", st.max_drawdown_pct!=null?'<span class="neg">-'+fmt(Math.abs(st.max_drawdown_pct),2)+'%</span>':null)+
    card("Trade", st.trades!=null?st.trades:null)+
    card("Giorni validi", st.valid_days!=null?st.valid_days:null)+
    card("Serie positiva migliore", st.best_streak!=null?st.best_streak+' giorni':null)+
    card("Serie positiva attuale", st.current_streak!=null?st.current_streak+' giorni':null)+
    card("Importo netto", st.net_amount!=null?sgn(st.net_amount):null)+
    '</section>';
  if(d.equity) html+='<section class="panel"><h2>Equity curve</h2>'+equitySVG(d.equity)+'</section>';
  if(d.history) html+='<section class="panel"><h2>Storico mensile</h2>'+historyBars(d.history)+'</section>';
  if(d.markets) html+='<section class="panel"><h2>Mercati negoziati</h2><div class="chips">'+(d.markets.length?d.markets.map(function(m){return '<span class="chip">'+esc(m)+'</span>'}).join(""):'<span class="muted">Nessun mercato</span>')+'</div></section>';
  if(rk&&rk.breakdown) html+='<section class="panel"><h2>Come si calcola il rating</h2><div class="muted">Giornate positive '+rk.breakdown.giornate_positive+' · Serie '+rk.breakdown.serie_positiva+' · Rendimento '+rk.breakdown.rendimento+' · Costanza '+rk.breakdown.costanza_settimanale+(rk.breakdown.penalita_drawdown?' · Drawdown '+rk.breakdown.penalita_drawdown:'')+'</div></section>';
  if(d.trades_detail) html+='<section class="panel"><h2>Ultimi trade</h2><div style="overflow-x:auto"><table><thead><tr><th>Data</th><th>Strumento</th><th>Lato</th><th class="n">Rendimento</th></tr></thead><tbody>'+
    d.trades_detail.map(function(t){return '<tr><td>'+esc(t.date)+'</td><td><b>'+esc(t.symbol)+'</b></td><td>'+(t.direction==="long"?"Long":"Short")+'</td><td class="n '+cls(t.return_pct)+'">'+sgn(t.return_pct)+'%</td></tr>'}).join("")+'</tbody></table></div></section>';
  html+='<p class="muted" style="font-size:12px;margin-top:10px">Risultati autodichiarati: i trade sono inseriti manualmente dal trader e non sono ancora verificati.</p>';
  show(html);
  if(d.position!==undefined&&d.position!==null){ var lb=document.getElementById("lbLink"); lb.style.display=""; }
}
init();
})();
</script>
</body>
</html>
